[package]
name = "record-maker-native"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keep portable foundation tests compatible with this workspace's Rust 1.88.
# The Windows Tauri application/toolchain will require Rust 1.90 or newer.
uuid = { version = "=1.18.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography",
  "Win32_System_JobObjects", "Win32_System_Threading"
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
