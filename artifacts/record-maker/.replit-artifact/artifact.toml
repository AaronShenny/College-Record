kind = "web"
previewPath = "/"
title = "Recordly"
description = "Browser development preview of Recordly, an independent Windows Tauri desktop app by extapano. The installed app uses account-separated local files, each student's Google Drive, and a lazy Python document engine; native Drive and Word behavior require the Windows app."
version = "1.0.0"
id = "artifacts/record-maker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23352

[services.development]
run = "pnpm --filter @workspace/record-maker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/record-maker", "run", "build" ]
serve = "static"
publicDir = "artifacts/record-maker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23352"
BASE_PATH = "/"
