appId: org.collegerecordmaker.desktop
productName: College Record Maker
artifactName: College-Record-Maker-Foundation-${version}-${arch}-Setup.${ext}
directories:
  output: ../../generated-artifacts/desktop
files:
  - dist/desktop/**
  - dist/renderer/**
  - package.json
  - "!node_modules{,/**}"
  - "!**/*.map"
extraMetadata:
  dependencies: {}
extraFiles:
  - from: legacy/electron/scripts/Start-Startup-Check.cmd
    to: Start-Startup-Check.cmd
  - from: legacy/electron/scripts/Start-Startup-Check.ps1
    to: Start-Startup-Check.ps1
  - from: legacy/electron/scripts/Start-Windows-Trace.cmd
    to: Start-Windows-Trace.cmd
  - from: legacy/electron/scripts/STARTUP-TRACE-README.txt
    to: STARTUP-TRACE-README.txt
  - from: dist/diagnostics/record-maker-startup-trace.exe
    to: record-maker-startup-trace.exe
extraResources:
  - from: dist/runtime-config
    to: config
  - from: dist/python/record-maker-worker
    to: python
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
