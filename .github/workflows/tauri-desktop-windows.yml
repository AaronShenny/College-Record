name: Tauri desktop Windows trial installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r artifacts/record-maker/python/build-requirements.txt
      - name: Prepare evidence
        run: node artifacts/record-maker/scripts/write-native-evidence.mjs
      - name: Verify shared application and bridge contracts
        shell: pwsh
        run: |
          pnpm --filter @workspace/record-maker run typecheck 2>&1 | Tee-Object generated-artifacts/tauri-foundation/types.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @workspace/record-maker run test:desktop 2>&1 | Tee-Object generated-artifacts/tauri-foundation/shared-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @workspace/record-maker run test:native-service 2>&1 | Tee-Object generated-artifacts/tauri-foundation/service-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify document formatting and question extraction
        shell: pwsh
        run: |
          python -m unittest discover -s artifacts/record-maker/python -p test_engine.py -v 2>&1 | Tee-Object generated-artifacts/tauri-foundation/document-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build complete trial installer
        shell: pwsh
        env:
          GOOGLE_DESKTOP_CLIENT_JSON: ${{ secrets.GOOGLE_DESKTOP_CLIENT_JSON }}
        run: |
          pnpm --filter @workspace/record-maker run tauri:package 2>&1 | Tee-Object generated-artifacts/tauri-foundation/desktop-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows data and owned-service boundary
        shell: pwsh
        run: |
          $env:RECORD_MAKER_TEST_NODE = (Get-Command node).Source
          cargo test --locked --manifest-path artifacts/record-maker/tauri/src-tauri/Cargo.toml 2>&1 | Tee-Object generated-artifacts/tauri-foundation/native-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: College-Record-Maker-Tauri-Trial
          path: generated-artifacts/tauri-desktop/
          if-no-files-found: error
      - name: Upload evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tauri-Desktop-Build-Evidence
          path: generated-artifacts/tauri-foundation/
          if-no-files-found: warn
