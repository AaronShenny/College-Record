name: Legacy Electron Windows reference build
on:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Also build the full installer
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  startup-trace-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node artifacts/record-maker/legacy/electron/scripts/build-startup-trace.mjs --standalone
      - uses: actions/upload-artifact@v4
        with:
          name: Startup-Trace-Tools
          path: generated-artifacts/startup-trace-tools/*
          if-no-files-found: error
  windows-installer:
    if: github.event_name != 'workflow_dispatch' || inputs.build_installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r artifacts/record-maker/python/build-requirements.txt
      - run: pnpm --filter @workspace/record-maker run test:desktop
      - run: pnpm --filter @workspace/record-maker run test:legacy
      - run: python -m unittest discover -s artifacts/record-maker/python -p "test_*.py" -v
      - run: pnpm --filter @workspace/record-maker run legacy:package
        env:
          GOOGLE_DESKTOP_CLIENT_JSON: ${{ secrets.GOOGLE_DESKTOP_CLIENT_JSON }}
          RECORD_MAKER_UPDATE_URL: ${{ vars.RECORD_MAKER_UPDATE_URL }}
          RECORD_MAKER_PUBLISHER_NAME: ${{ vars.RECORD_MAKER_PUBLISHER_NAME }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop-foundation-unsigned
          path: |
            generated-artifacts/desktop/*.exe
            generated-artifacts/desktop/*.yml
            generated-artifacts/desktop/*.blockmap
