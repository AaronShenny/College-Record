name: Build Windows desktop foundation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r artifacts/record-maker/python/build-requirements.txt
      - run: pnpm --filter @workspace/record-maker run test:desktop
      - run: pnpm --filter @workspace/record-maker run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop-foundation-unsigned
          path: generated-artifacts/desktop/*.exe
